<title>قوام</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* QAWAM design system. One dark theme only; every color comes from these tokens.
   Layout: phone-first single column, sticky brand bar, fixed five-tab bottom navigation. */
:root{
  --background:#101B17; --surface:#1B2923; --surface-elevated:#294137;
  --primary:#173F35; --secondary:#789887;
  --text-primary:#E9E2D6; --text-secondary:#9DAAA1; --border:#35443C;
  --warning:#F29A38; --danger:#D94B3D;
  /* derived (still from the tokens above) */
  --secondary-soft:rgba(120,152,135,.16); --cream-soft:rgba(233,226,214,.08);
  --warning-soft:rgba(242,154,56,.13); --danger-soft:rgba(217,75,61,.14);
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:16px; --r-sm:11px;
  /* aliases kept for older component code */
  --bg:var(--background); --surface-2:var(--surface-elevated); --ink:var(--text-primary); --muted:var(--text-secondary); --line:var(--border);
  --accent:var(--secondary); --accent-soft:var(--secondary-soft); --good:var(--secondary); --good-soft:var(--secondary-soft);
  --warn:var(--warning); --warn-soft:var(--warning-soft); --bad:var(--danger); --plate:var(--secondary);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--background)}
body{color:var(--text-primary);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--background)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;letter-spacing:0}
h2{font-size:22px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text-primary)}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--text-secondary)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:12px;color:var(--text-secondary);font-weight:600}

/* brand bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--background);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;display:block}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:10px;letter-spacing:2.5px;color:var(--text-secondary);font-weight:600;line-height:1}
.sync{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-secondary)}
.dot.on{background:var(--secondary)} .dot.local{background:var(--warning)}
.back{background:none;border:0;color:var(--text-secondary);font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.back svg{width:18px;height:18px}

/* bottom navigation */
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--text-secondary);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--text-primary);font-weight:700}
.nav button[aria-current="page"] .ni{background:var(--primary);border-radius:999px}
.ni{display:grid;place-items:center;width:48px;height:28px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card.stack,.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{font-size:16px}
.sec-h a,.linkbtn{background:none;border:0;color:var(--secondary);font-weight:600;font-size:13px;padding:0}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:14px;background:var(--surface-elevated);color:var(--text-primary)}
.note.warn{background:var(--warning-soft);color:var(--warning)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:19px}
.empty p{max-width:40ch;color:var(--text-secondary)}
.skeleton{height:14px;border-radius:7px;background:var(--surface-elevated);opacity:.6}

/* buttons */
.btn{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px;color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface-elevated)}
.btn.primary{background:var(--primary);border-color:var(--secondary)}
.btn.primary:hover{background:#1d4a3f}
.btn.cta{background:var(--text-primary);border-color:var(--text-primary);color:var(--background);font-weight:700}
.btn.cta:hover{background:#f3eee5}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:var(--r)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--text-primary)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px;color:var(--text-secondary)}
.chip[aria-pressed="true"]{background:var(--text-primary);color:var(--background);border-color:var(--text-primary)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.up{background:var(--secondary-soft);color:var(--secondary)}
.pill.hold,.pill.new{background:var(--cream-soft);color:var(--text-secondary)}
.pill.down{background:var(--warning-soft);color:var(--warning)}
.pill.pr{background:transparent;border:1px solid var(--text-primary);color:var(--text-primary)}

/* home */
.greet h2{font-size:24px}
.greet p{color:var(--text-secondary);font-size:13.5px}
.week{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1.1;text-align:center}
.ring b small{display:block;font-size:11px;color:var(--text-secondary);font-weight:500}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary)}
.wd i{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--text-secondary)}
.wd.plan i{border-color:var(--secondary);border-style:dashed}
.wd.done i{background:var(--secondary);border-color:var(--secondary);color:var(--background);font-weight:700}
.wd.today span{color:var(--text-primary);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--border);padding-top:12px}
.kpi b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--text-secondary)}
.today-card{border-color:var(--secondary)}
.today-card h2{font-size:28px}
.exlist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.exlist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.exlist li:first-child{border-top:0}
.exlist .k{min-width:26px;color:var(--secondary);font-weight:700;font-size:12.5px}
.exlist .n{flex:1;min-width:0}
.exlist .s{color:var(--text-secondary);font-size:12.5px;white-space:nowrap}
.sched{display:flex;flex-direction:column}
.sched-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.sched-row:first-child{border-top:0}
.activebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--primary);border:1px solid var(--secondary);border-radius:var(--r);padding:10px 14px}
.activebar b{font-size:14px}

/* exercise rows, thumbs, library */
.thumb{flex:none;width:60px;height:60px;border-radius:12px;border:1px solid var(--border);background:var(--surface-elevated);position:relative;display:grid;place-items:center;padding:0;color:var(--text-secondary);overflow:visible}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block;filter:saturate(.75)}
.thumb .cam{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600}
.thumb .cam svg{width:20px;height:20px}
.mark{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--text-primary);color:var(--background)}
.thumb .mark{position:absolute;top:-7px;right:-7px;border:2px solid var(--surface)}
.ex-name{font-weight:600;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.ex-en{font-size:12px;color:var(--text-secondary);direction:ltr;text-align:right;unicode-bidi:plaintext}
.ex-target{font-size:13px;color:var(--text-secondary)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0 12px}
.search svg{width:18px;height:18px;color:var(--text-secondary);flex:none}
.search input{flex:1;min-width:0;height:46px;border:0;background:transparent;outline:none;font-size:15px}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.lib{display:flex;flex-direction:column;gap:10px}
.lib-item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.lib-item .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--text-secondary);margin-top:4px}
.lib-item .meta b{color:var(--text-primary);font-weight:600}

/* programs */
.pday{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}

.ptpl{display:flex;flex-direction:column;gap:8px}
.ptpl.current{border-color:var(--secondary)}

/* superset groups (programs editor, workout) */
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.group.ss{border-inline-start:3px solid var(--secondary)}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface-elevated);font-size:13px;font-weight:600}
.ex{padding:14px;display:flex;flex-direction:column;gap:9px}
.ex + .ex{border-top:1px dashed var(--border)}
.ex-h{display:flex;align-items:flex-start;gap:12px}
.sug{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--text-secondary)}
.last{font-size:13px;color:var(--text-secondary)}
.demo{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface-elevated);display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0}
.demo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.75)}
.demo.one{grid-template-columns:1fr}

/* workout */
.wbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wbar h2{font-size:24px}
.clockbox{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.progress-line{height:6px;border-radius:3px;background:var(--surface-elevated);overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--secondary);transition:width .3s}
.wg-h{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;text-align:right}
.wg-h .n{flex:1;min-width:0;font-weight:600;font-size:14px}
.wg-h.done{opacity:.7}
.wg-h .idx{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-elevated);font-weight:700;font-size:13px;flex:none}
.wg-h.done .idx{background:var(--secondary);color:var(--background)}
.current-tag{font-size:11.5px;font-weight:700;color:var(--secondary)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-head{display:grid;grid-template-columns:22px 64px 1fr 1fr 46px;gap:6px;align-items:center}
.set-head{font-size:11.5px;color:var(--text-secondary);font-weight:600;text-align:center}
.set .i{font-size:13px;color:var(--text-secondary);text-align:center;font-weight:600}
.prev{height:46px;border-radius:var(--r-sm);background:var(--surface-elevated);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-variant-numeric:tabular-nums}
.prev b{font-size:15px;font-weight:700}
.prev small{font-size:11px;color:var(--text-secondary)}
.prev.none{color:var(--text-secondary);font-size:11.5px}
.field{position:relative}
.field input{width:100%;height:46px;border:1px solid var(--border);background:var(--background);border-radius:var(--r-sm);padding:0 8px 0 30px;font-size:18px;font-weight:600;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--secondary);outline:none}
.field input::placeholder{color:var(--text-secondary);opacity:.6}
.field span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--text-secondary);pointer-events:none}
.tick{height:46px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;display:grid;place-items:center;color:var(--text-secondary)}
.tick svg{width:20px;height:20px;opacity:.5}
.set.done .tick{background:var(--secondary);border-color:var(--secondary);color:var(--background)}
.set.done .tick svg{opacity:1}
.set.done input{background:var(--secondary-soft);border-color:transparent}
.cmp{grid-column:3 / -1;display:flex;align-items:center;gap:8px;font-size:12px;margin-top:-2px}
.delta{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 9px;font-weight:600;font-size:12px;white-space:nowrap}
.delta.up{background:var(--secondary);color:var(--background)}
.delta.same{background:var(--surface-elevated);color:var(--text-secondary)}
.delta.down{background:var(--warning-soft);color:var(--warning)}
.delta.fresh,.fire.fresh{animation:pop .4s ease-out}
.fire{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--secondary);color:var(--background);margin-top:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.rest{position:fixed;z-index:7;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  max-width:616px;margin:0 auto;background:var(--surface-elevated);border:1px solid var(--secondary);color:var(--text-primary);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px}
.rest .t{font-size:26px;font-weight:700;min-width:72px;direction:ltr;font-variant-numeric:tabular-nums}
.rest .lbl{flex:1;font-size:13px;line-height:1.3;color:var(--text-secondary)}
.rest button{background:transparent;border:1px solid var(--border);color:inherit;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.rest.over{border-color:var(--text-primary)} .rest.over .lbl{color:var(--text-primary)}

/* muscles, notes, technique */
.mus{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;margin-top:3px}
.mus i{display:inline-block;width:7px;height:7px;margin-inline-end:5px;vertical-align:1px;transform:rotate(45deg)}
.mus-p{color:var(--text-primary);font-weight:600}.mus-p i{background:var(--secondary)}
.mus-s{color:var(--text-secondary)}.mus-s i{border:1.5px solid var(--text-secondary)}
.mus-sheet{display:flex;flex-direction:column;gap:8px}
.mus-sheet .chips{margin-top:4px}
.mchip{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.mchip.p{background:var(--secondary-soft);color:var(--text-primary);border:1px solid var(--secondary)}
.mchip.s{background:var(--surface-elevated);color:var(--text-secondary)}
.exlinks{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.techbtn{background:none;border:0;padding:2px 0;color:var(--secondary);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.techbtn svg{width:15px;height:15px}
.techbtn.subtle{color:var(--text-secondary);font-weight:500}
.exnote{display:inline-flex;align-items:flex-start;gap:6px;background:var(--surface-elevated);color:var(--text-primary);border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:500;text-align:right;margin-top:2px;line-height:1.4}
.exnote svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--secondary)}
.note-ed{display:flex;flex-direction:column;gap:6px}
.note-ed textarea{width:100%;min-height:64px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--background);font-size:15px;resize:vertical}
.note-ed textarea:focus{border-color:var(--secondary);outline:none}
.tech{display:flex;flex-direction:column;gap:10px}
.tech-sec ol,.tech-sec ul{margin:4px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
.tech-sec.tips b{color:var(--secondary)}
.tech-sec.avoid b{color:var(--warning)}
.stock{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stock figure{margin:0;display:flex;flex-direction:column;gap:4px}
.stock figcaption{font-size:12px;color:var(--text-secondary);text-align:center;font-weight:600}
.viewer-img{width:100%;max-height:56vh;object-fit:contain;border-radius:12px;background:var(--surface-elevated);display:block;filter:saturate(.8)}
.addphoto{height:110px;border:1px dashed var(--border);border-radius:12px;background:var(--surface-elevated);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-secondary);font-weight:600}
.addphoto svg{width:24px;height:24px}
.factrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface-elevated);border-radius:var(--r-sm);padding:8px 10px}
.fact b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.fact span{font-size:11.5px;color:var(--text-secondary)}

/* statistics */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.tile b{display:block;font-size:22px;font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--text-secondary)}
.seg{display:inline-flex;background:var(--background);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text-secondary)}
.seg button[aria-pressed="true"]{background:var(--surface-elevated);color:var(--text-primary)}
select.inp{width:100%;height:44px;border:1px solid var(--border);background:var(--background);border-radius:var(--r-sm);padding:0 12px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-size:11px;fill:var(--text-secondary);font-family:var(--font)}
.chart .lbl-end,.chart .bv{fill:var(--text-primary);font-weight:600;font-size:11.5px}
.hist{display:flex;flex-direction:column}
.hist-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:14px;align-items:baseline;flex-wrap:wrap}
.hist-row:first-child{border-top:0}
.sess{border-top:1px solid var(--border)} .sess:first-child{border-top:0}

  const last = h[h.length - 1].sets.filter(s => s.r > 0);
  if (!last.length) return { kind: "new", w: null, r: ex.min, text: "ما فيه جولات مسجلة آخر مرة." };
  const topW = Math.max(...last.map(s => s.w));

  const below = work.some(s => s.r < ex.min);

  }
  if (below) {

    const prevTop = prev.length ? Math.max(...prev.map(s => s.w)) : null;
    const prevBelow = prevTop === topW && prev.filter(s => s.w === topW).some(s => s.r < ex.min);

      const w = Math.max(0, roundTo(topW * 0.9, inc));

    }
    return { kind: "hold", w: topW, r: ex.min, text: "نفس الوزن " + fmt(topW) + " كغ. هدفك " + ex.min + " عدات على الأقل في كل جولة." };
  }
  const minR = Math.min(...work.map(s => s.r));
  const goal = Math.min(minR + 1, ex.max);

function upcoming(n) {

  const days = S.plan.days, nd = nextDay(); let idx = days.findIndex(d => d.id === nd.id);
  const td = Array.isArray(S.plan.trainDays) ? S.plan.trainDays : [];
  const out = [], now = new Date(); now.setHours(0, 0, 0, 0);
  const doneToday = sorted().some(s => new Date(s.date) >= now);
  if (!td.length) { for (let i = 0; i < n; i++) out.push({ day: days[(idx + i) % days.length], date: null }); return out; }
  const d = new Date(now); if (doneToday) d.setDate(d.getDate() + 1);
  for (let guard = 0; out.length < n && guard < 21; guard++, d.setDate(d.getDate() + 1)) {
    if (td.includes(d.getDay())) { out.push({ day: days[idx % days.length], date: new Date(d) }); idx++; }
  }
  return out;
}
function relDay(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0); const diff = Math.round((d - t) / 864e5);
  return diff === 0 ? "اليوم" : diff === 1 ? "بكرة" : WD_FULL[d.getDay()] + " " + dateFmt(d.toISOString(), { day: "numeric", month: "short" });
}
function emptyState(title, text, btn) { return '<div class="card empty"><h2>' + title + "</h2><p>" + text + "</p>" + (btn || "") + "</div>"; }
function activeBar() {
  if (!S.active || S.view === "workout") return "";

}

  if (location.hash !== "#" + v) { try { location.hash = v; } catch (e) {} }

/* ---------- home ---------- */
function viewHome() {

  const wk = list.filter(s => { const t = new Date(s.date); return t >= ws && t < we; });
  const tg = target(), done = wk.length, pct = Math.min(1, done / tg);
  const mins = wk.reduce((a, s) => a + (s.durationSec || 0), 0) / 60, vol = wk.reduce((a, s) => a + sessVol(s), 0);

/* ---------- exercise library ---------- */
function libraryList() {
  const m = new Map();
  libEx.forEach((e, id) => m.set(id, { ex: e, inPlan: false }));
  allEx(S.plan).forEach(e => m.set(e.id, { ex: e, inPlan: true }));

}
function libGroups(items) {
  const set = []; items.forEach(it => { const mm = musclesFor(it.ex.id); if (mm) mm.p.forEach(x => { const g = groupOf(x); if (!set.includes(g)) set.push(g); }); });
  return set;
}
function libMatches(it) {
  const q = (S.libQ || "").trim().toLowerCase();
  if (S.libG) { const mm = musclesFor(it.ex.id); if (!mm || !mm.p.some(x => groupOf(x) === S.libG)) return false; }
  if (!q) return true;
  const mm = musclesFor(it.ex.id);
  return [arName(it.ex.id, it.ex.name), it.ex.name].concat(mm ? mm.p.concat(mm.s) : []).join(" ").toLowerCase().includes(q);
}

function kcalLiveText() { const k = S.active ? kcalFor((Date.now() - S.active.start) / 1000) : null; return k != null ? "≈ " + k + " سعرة" : "أضف وزنك في المزيد للسعرات"; }
function groupStatus(A, g) { let t = 0, d = 0; g.ex.forEach(e => (A.log[e.id] || []).forEach(s => { t++; if (s.done) d++; })); return { t, d }; }
function currentGroup(A) { const i = A.day.groups.findIndex(g => { const s = groupStatus(A, g); return s.d < s.t; }); return i < 0 ? A.day.groups.length - 1 : i; }

    '<div class="progress-line" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><i style="width:' + (total ? Math.round(done / total * 100) : 0) + '%"></i></div>' +

        (better ? '<span class="fire' + (S.fresh === ex.id + ":done" ? " fresh" : "") + '">↑ تحسنت عن آخر مرة</span>' : "") + "</div></div>" +

/* ---------- charts ---------- */
function seriesFor(exId, metric) {
  return history(exId).map(x => {
    const v = metric === "top" ? Math.max(...x.sets.map(s => s.w)) : metric === "vol" ? x.sets.reduce((a, s) => a + s.w * s.r, 0) : Math.max(...x.sets.map(s => e1rm(s.w, s.r)));
    return { date: x.date, v: r1(v), sets: x.sets };
  });
}
function niceTicks(min, max, n) {
  if (min === max) { min = min - 1; max = max + 1; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(r1(v));
  return t;
}
function chart(pts, unit) {
  const W = 360, H = 200, Lm = 18, R = 40, T = 20, B = 26; // RTL: oldest point on the right, newest on the left
  const vs = pts.map(p => p.v);
  const ticks = niceTicks(Math.min(...vs), Math.max(...vs), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => pts.length === 1 ? (Lm + (W - R)) / 2 : (W - R) - i * (W - Lm - R) / (pts.length - 1);
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="رسم التطور">';
  ticks.forEach(t => { s += '<line x1="' + Lm + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--border)" stroke-width="1"/><text x="' + (W - R + 8) + '" y="' + (Y(t) + 4) + '" text-anchor="start">' + fmt(t) + "</text>"; });
  const line = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  if (pts.length > 1) {
    s += '<path d="' + line + " L" + X(pts.length - 1).toFixed(1) + " " + Y(y0) + " L" + X(0).toFixed(1) + " " + Y(y0) + ' Z" fill="var(--secondary)" fill-opacity=".12"/>';
    s += '<path d="' + line + '" fill="none" stroke="var(--secondary)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach((p, i) => { const end = i === pts.length - 1; s += '<circle cx="' + X(i) + '" cy="' + Y(p.v) + '" r="' + (end ? 5 : 3) + '" fill="' + (end ? "var(--text-primary)" : "var(--surface)") + '" stroke="' + (end ? "var(--text-primary)" : "var(--secondary)") + '" stroke-width="2"/>'; });
  const li = pts.length - 1, lx = X(li), anchor = pts.length === 1 ? "middle" : "start";
  s += '<text class="lbl-end" x="' + lx + '" y="' + (Y(pts[li].v) - 11) + '" text-anchor="' + anchor + '">' + fmt(pts[li].v) + " " + unit + "</text>";
  const dl = d => dateFmt(d, { day: "numeric", month: "short" });
  s += '<text x="' + X(0) + '" y="' + (H - 8) + '" text-anchor="' + (pts.length === 1 ? "middle" : "end") + '">' + esc(dl(pts[0].date)) + "</text>";
  if (pts.length > 1) s += '<text x="' + lx + '" y="' + (H - 8) + '" text-anchor="start">' + esc(dl(pts[li].date)) + "</text>";
  return s + "</svg>";
}
function barChart(items, label) {
  const W = 360, H = 170, Lm = 8, R = 8, T = 20, B = 24, n = items.length;
  const max = Math.max(1, ...items.map(i => i.v)), bw = (W - Lm - R) / n;
  let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '"><line x1="' + Lm + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--border)"/>';
  items.forEach((it, i) => {
    const h = (H - T - B) * it.v / max, x = Lm + (n - 1 - i) * bw + bw * 0.18, w = bw * 0.64, last = i === n - 1;
    s += '<rect x="' + x.toFixed(1) + '" y="' + (H - B - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) + '" rx="3" fill="' + (last ? "var(--text-primary)" : "var(--secondary)") + '"/>';
    if (it.v > 0) s += '<text class="bv" x="' + (x + w / 2).toFixed(1) + '" y="' + (H - B - h - 5).toFixed(1) + '" text-anchor="middle">' + esc(it.t) + "</text>";
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(it.label) + "</text>";
  });
  return s + "</svg>";
}
function periodBuckets(range) {
  const out = [], list = sorted();
  if (range === "month") {
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const st = new Date(now.getFullYear(), now.getMonth() - i, 1), en = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      const ss = list.filter(s => { const t = new Date(s.date); return t >= st && t < en; });
      let lbl = ""; try { lbl = st.toLocaleDateString("ar-SA-u-nu-latn-ca-gregory", { month: "short" }); } catch (e) { lbl = String(st.getMonth() + 1); }
      out.push({ label: lbl, ss });
    }
  } else {
    for (let i = 7; i >= 0; i--) {
      const st = weekStart(-i), en = new Date(st); en.setDate(en.getDate() + 7);
      out.push({ label: st.getDate() + "/" + (st.getMonth() + 1), ss: list.filter(s => { const t = new Date(s.date); return t >= st && t < en; }) });
    }
  }
  return out;
}

/* ---------- statistics ---------- */
function prList() {
  const ids = new Set(); sorted().forEach(s => (s.entries || []).forEach(e => ids.add(e.exId)));
  return [...ids].map(id => {
    const h = history(id); if (!h.length) return null;
    let best = null, bestE = 0;
    h.forEach(x => x.sets.forEach(st => { if (!best || st.w > best.w || (st.w === best.w && st.r > best.r)) best = { w: st.w, r: st.r, date: x.date }; bestE = Math.max(bestE, e1rm(st.w, st.r)); }));
    return { id, name: arName(id, h[h.length - 1].name), best, e1: bestE };
  }).filter(Boolean).sort((a, b) => (a.best.date < b.best.date ? 1 : -1));
}

  const list = sorted(), range = S.statRange || "week";

    barChart(b.map(x => { const v = x.ss.reduce((a, s) => a + sessVol(s), 0); return { label: x.label, v, t: kfmt(v) }; }), "حجم التمرين") + "</section>";
  h += calendarHtml(list);

    '<select class="inp" id="progEx" data-in="progEx" aria-label="اختر التمرين">' + [...known.entries()].map(([id, n]) => '<option value="' + esc(id) + '"' + (id === S.progEx ? " selected" : "") + ">" + esc(n) + (history(id).length ? "" : " (بدون سجل)") + "</option>").join("") + "</select>" +
    '<div class="seg" role="group" aria-label="المقياس">' + [["top", "أعلى وزن"], ["e1rm", "القوة التقديرية"], ["vol", "الحجم"]].map(([k, l]) => '<button data-act="metric" data-v="' + k + '" aria-pressed="' + (S.progMetric === k) + '">' + l + "</button>").join("") + "</div>";

  h += volumeHtml() + bodyHtml();

  list.slice().reverse().forEach(s => {
    const open = S.openSess === s.id;
    h += '<div class="sess"><button data-act="openSess" data-id="' + esc(s.id) + '" aria-expanded="' + open + '"><span><b>' + esc(s.dayName || "تمرين") + '</b> <span class="muted small">' + esc(dateFmt(s.date)) + '</span></span><span class="muted small"><span class="num">' + sessSets(s) + "</span> جولة</span></button>";
    if (open) h += '<div class="sess-body"><div class="small muted">' + sessMeta(s) + "</div>" + (s.entries || []).map(en => '<div class="spread"><span class="ex-name">' + esc(arName(en.exId, en.name)) + '</span><span class="num muted">' + esc(setsText(en.sets)) + "</span></div>").join("") +
      '<div><button class="btn danger sm ' + (S.armed === "del:" + s.id ? "armed" : "") + '" data-act="delSess" data-id="' + esc(s.id) + '">' + (S.armed === "del:" + s.id ? "اضغط مرة ثانية للحذف" : "احذف الجلسة") + "</button></div></div>";
    h += "</div>";

  return h + "</div></section>";

    case "bodyDel": if (prevArmed === "body:" + b.dataset.id) { try { await dropBody(b.dataset.id); toast("انحذف"); } catch (x) { writeErr(x); } } else S.armed = "body:" + b.dataset.id; render(); break;
    case "calMove": { const [y, m] = S.calMonth; const d = new Date(y, m + +b.dataset.dir, 1); S.calMonth = [d.getFullYear(), d.getMonth()]; S.calDay = null; render(); break; }
    case "calDay": S.calDay = S.calDay === +b.dataset.d ? null : +b.dataset.d; render(); break;
    case "addGp": { const gi = document.getElementById("gpIn"); if (gi) gi.click(); break; }
    case "delGp": {
      const id = b.dataset.id;
      if (prevArmed === "gp:" + id) { const p = S.gymPhotos.find(x => x.id === id); try { await S.db.doc("gymphotos/" + id).delete(); if (p && S.assets) S.assets.delete(p.asset).catch(() => {}); toast("انحذفت"); } catch (x) { writeErr(x); } }
      else S.armed = "gp:" + id;
      render(); break;
    }
    case "starter": sendCoach(b.dataset.t); break;
    case "stopCoach": if (S.coachCtl) S.coachCtl.abort(); break;
    case "clearChat": if (prevArmed === "clearChat") { S.chat = []; S.pending = null; await saveChat(); } else S.armed = "clearChat"; render(); break;
    case "dismissPlan": S.pending = null; paintPending(); break;
    case "applyPlan": {
      if (!S.pending) break;
      try { await putPlan(S.pending.plan); S.pending = null; S.draft = null; S.dirty = false; S.chat.push({ role: "assistant", content: "✓ طبّقت الخطة الجديدة. تلقاها في البرامج والرئيسية." }); await saveChat(); toast("تم تطبيق الخطة"); } catch (x) { writeErr(x); }
      render(); scrollEnd(); break;
    }
    case "copyReport": {
      const txt = reportText();
      try { await navigator.clipboard.writeText(txt); toast("انسخ التقرير. الصقه لـ Claude."); } catch (x) { toast("ما قدرت أنسخ. جرّب من نسخة Claude."); }
      break;
    }
    case "photoChange": pickPhoto(b.dataset.ex); break;
    case "photoDel": if (prevArmed === "photo:" + b.dataset.ex) { try { await removePhoto(b.dataset.ex); toast("انحذفت الصورة"); } catch (x) { writeErr(x); } S.photoView = null; render(); } else { S.armed = "photo:" + b.dataset.ex; renderOverlay(); } break;
    case "metric": S.progMetric = b.dataset.v; render(); break;
    case "openSess": S.openSess = S.openSess === b.dataset.id ? null : b.dataset.id; render(); break;
    case "delSess": if (prevArmed === "del:" + b.dataset.id) { try { await dropSession(b.dataset.id); toast("انحذفت الجلسة"); } catch (x) { writeErr(x); } } else S.armed = "del:" + b.dataset.id; render(); break;
    case "loadTemplate": try { await applyProgram("ppl"); toast("تم تحميل البرنامج"); } catch (x) { writeErr(x); } render(); break;
    case "savePlan": {
      const err = validDraft(D); if (err) { toast(err); render(); break; }
      try { await putPlan(D); S.dirty = false; S.draft = null; toast("انحفظت الخطة"); } catch (x) { writeErr(x); }
      render(); break;
    }
    case "revert": S.draft = null; S.dirty = false; render(); break;
    case "addDay": D.days.push({ id: "d" + uid(), name: "يوم " + (D.days.length + 1), groups: [{ id: "g" + uid(), ex: [newEx(), newEx()] }] }); markDirty(); render(); break;
    case "delDay": if (prevArmed === "day:" + d) { D.days.splice(d, 1); markDirty(); } else S.armed = "day:" + d; render(); break;
    case "addSS": D.days[d].groups.push({ id: "g" + uid(), ex: [newEx(), newEx()] }); markDirty(); render(); break;
    case "addEx": D.days[d].groups.push({ id: "g" + uid(), ex: [newEx()] }); markDirty(); render(); break;
    case "addToG": D.days[d].groups[g].ex.push(newEx()); markDirty(); render(); break;
    case "mvG": { const gs = D.days[d].groups, j = g + +b.dataset.dir; if (j >= 0 && j < gs.length) { [gs[g], gs[j]] = [gs[j], gs[g]]; markDirty(); } render(); break; }
    case "link": { const gs = D.days[d].groups; if (gs[g + 1]) { gs[g].ex = gs[g].ex.concat(gs[g + 1].ex); gs.splice(g + 1, 1); markDirty(); } render(); break; }
    case "unlink": { const gs = D.days[d].groups; const rest = gs[g].ex.slice(1).map(x => ({ id: "g" + uid(), ex: [x] })); gs[g].ex = gs[g].ex.slice(0, 1); gs.splice(g + 1, 0, ...rest); markDirty(); render(); break; }
    case "delEx": {
      const key = "ex:" + d + "-" + g + "-" + b.dataset.e;
      if (prevArmed === key) { const gs = D.days[d].groups; gs[g].ex.splice(+b.dataset.e, 1); if (!gs[g].ex.length) gs.splice(g, 1); markDirty(); }
      else S.armed = key;
      render(); break;
    }
    case "exportCopy": {
      const txt = JSON.stringify({ app: "iron-log", version: 1, exportedAt: new Date().toISOString(), plan: S.plan, sessions: S.sessions, photos: photoAll() });
      S.exportText = txt;
      const ta = document.getElementById("backup"); if (ta) ta.value = txt;
      try { await navigator.clipboard.writeText(txt); toast("انسخت. الصقها في الملاحظات واحفظها."); }
      catch (x) { if (ta) { ta.focus(); ta.select(); } toast("ما قدرت أنسخ تلقائياً. النص محدد، انسخه بنفسك."); }
      break;
    }
    case "importRun": {
      if (prevArmed !== "import") { S.armed = "import"; render(); break; }
      let data; try { data = JSON.parse(S.exportText); } catch (x) { toast("النص مو نسخة احتياطية صحيحة."); render(); break; }
      if (!data || !data.plan || !Array.isArray(data.plan.days)) { toast("النص مو نسخة احتياطية صحيحة."); render(); break; }
      try {
        await putPlan(data.plan);
        for (const s of (data.sessions || [])) if (s && s.id && s.date) await putSession(s);
        if (data.photos && typeof data.photos === "object") for (const k in data.photos) if (typeof data.photos[k] === "string" && data.photos[k].indexOf("data:image/") === 0) photoSet(k, data.photos[k]);
        S.draft = null; S.dirty = false; S.exportText = ""; toast("تم الاسترجاع");
      } catch (x) { writeErr(x); }
      render(); break;
    }
  }
});

document.getElementById("photoIn").addEventListener("change", async e => {
  const inp = e.target, f = inp.files && inp.files[0]; inp.value = "";
  if (!f || !photoTarget) return;
  if (canCloud()) toast("نرفع الصورة…");
  try { if (await savePhoto(photoTarget, f)) { S.photoView = null; toast("انحفظت صورة الجهاز"); render(); } }
  catch (x) { toast(x && x.code === "quota_exceeded" ? "المساحة امتلت." : "ما قدرت أحفظ الصورة. جرّب صورة ثانية."); }
});
document.getElementById("gpIn").addEventListener("change", e => {
  const files = Array.from(e.target.files || []); e.target.value = "";
  if (files.length) addGymPhotos(files);
});
boot();
})();
</script>
