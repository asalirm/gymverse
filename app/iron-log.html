<title>دفتر الحديد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, bold orange hero for today's session, superset pairs share one card with a violet spine, fixed bottom tab bar. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#EEF0F6; --ink:#151A2D; --muted:#646B82; --line:#E3E6EF;
  --accent:#FF5B2E; --accent-2:#FF8F3D; --accent-ink:#FFFFFF; --accent-soft:#FFE7DF;
  --plate:#6D5BFF; --plate-soft:#ECE9FF; --plate-ink:#3B2DB8;
  --good:#12A867; --good-soft:#DDF6EA; --warn:#B86E00; --warn-soft:#FFF1D6; --bad:#E5484D; --bad-soft:#FDE3E4;
  --shadow:0 1px 2px rgba(21,26,45,.06),0 6px 20px rgba(21,26,45,.06);
  --f-display:"Alexandria","Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-num:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#171C2E; --surface-2:#20263B; --ink:#EEF0F7; --muted:#9AA1B8; --line:#2A3149;
    --accent:#FF6A3D; --accent-2:#FF9A4A; --accent-ink:#FFFFFF; --accent-soft:#3A2018;
    --plate:#8C7DFF; --plate-soft:#25224A; --plate-ink:#CFC8FF;
    --good:#2FD486; --good-soft:#123426; --warn:#F2B13D; --warn-soft:#3A2C12; --bad:#FF6B6F; --bad-soft:#3D1C20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2E; --surface-2:#20263B; --ink:#EEF0F7; --muted:#9AA1B8; --line:#2A3149;
  --accent:#FF6A3D; --accent-2:#FF9A4A; --accent-ink:#FFFFFF; --accent-soft:#3A2018;
  --plate:#8C7DFF; --plate-soft:#25224A; --plate-ink:#CFC8FF;
  --good:#2FD486; --good-soft:#123426; --warn:#F2B13D; --warn-soft:#3A2C12; --bad:#FF6B6F; --bad-soft:#3D1C20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.eyebrow,.hero .meta{letter-spacing:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--f-display);font-size:21px;font-weight:800}
.plate-ico{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:none}
.plate-ico::after{content:"";position:absolute;inset:8px;border-radius:50%;border:3.5px solid #fff}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.local{background:var(--warn)}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button[aria-current="page"] svg{background:var(--accent-soft);border-radius:999px;padding:3px 14px;width:52px;height:30px;box-sizing:border-box}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:var(--r)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.up{background:var(--good-soft);color:var(--good)}
.pill.hold{background:var(--accent-soft);color:var(--accent)}
.pill.down{background:var(--warn-soft);color:var(--warn)}
.pill.new{background:var(--surface-2);color:var(--muted)}
.pill.pr{background:var(--plate-soft);color:var(--plate-ink)}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:14px;background:var(--surface-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-family:var(--f-display);font-size:22px;font-weight:700}
.empty p{margin:0;max-width:40ch;color:var(--muted)}

/* hero */
.hero{display:flex;flex-direction:column;gap:12px;background:linear-gradient(140deg,var(--accent) 0%,var(--accent-2) 100%);border:0;color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.12);left:-70px;top:-80px;pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h2{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1.1}
.hero .meta{color:rgba(255,255,255,.9);font-size:14px}
.hero .chip{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.hero .chip[aria-pressed="true"]{background:#fff;color:var(--accent)}
.hero .btn.primary{background:#fff;color:var(--accent);font-weight:700}

/* superset group */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;box-shadow:var(--shadow)}
.group.ss{border-inline-start:5px solid var(--plate)}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface-2);font-size:13px;font-weight:700}
.group-h .tag{display:inline-flex;align-items:center;gap:6px}
.group.ss .group-h .tag{color:var(--plate-ink)}
.group.ss .group-h{background:var(--plate-soft)}
.ex{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ex + .ex{border-top:1px dashed var(--line)}
.ex-h{display:flex;align-items:flex-start;gap:10px}
.mark{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--plate);color:#fff}
.ex-name{font-weight:600;line-height:1.35;direction:ltr;text-align:right;unicode-bidi:plaintext;min-width:0;overflow-wrap:anywhere}
.ex-target{font-size:13px;color:var(--muted)}
.sug{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.last{font-size:13px;color:var(--muted)}

/* set rows */
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 64px 1fr 1fr 46px;gap:6px;align-items:center}
.prev{height:46px;border-radius:var(--r-sm);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-variant-numeric:tabular-nums}
.prev b{font-size:15px;font-weight:700;color:var(--ink)}
.prev small{font-size:11px;color:var(--muted)}
.prev.none{color:var(--muted);font-size:11.5px}
.set .i{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.field{position:relative}
.field input{width:100%;height:46px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:0 8px 0 30px;font-family:var(--f-num);font-size:18px;font-weight:600;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field input::placeholder{color:var(--muted);opacity:.65}
.field span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{height:46px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tick svg{width:20px;height:20px;opacity:.35}
.set.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.set.done .tick svg{opacity:1}
.set.done input{background:var(--good-soft);border-color:transparent}
.set-head{display:grid;grid-template-columns:22px 64px 1fr 1fr 46px;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}

/* workout bar */
.wbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wbar h2{font-family:var(--f-display);font-size:28px;font-weight:800}
.clock{font-family:var(--f-num);font-size:15px;color:var(--muted)}
.progress-line{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}

/* comparison with last session */
.cmp{grid-column:3 / -1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:-2px}
.delta{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 9px;font-weight:700;font-size:12px;white-space:nowrap}
.delta.up{background:var(--good);color:#fff}
.delta.fresh,.fire.fresh{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.delta.same{background:var(--surface-2);color:var(--muted)}
.delta.down{background:var(--warn-soft);color:var(--warn)}
.newload{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.fire{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--good);color:#fff;margin-top:4px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* coach */
.coach-head h2{font-family:var(--f-display);font-size:26px;font-weight:800}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.65;font-size:15px;overflow-wrap:anywhere;min-width:0}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:4px 0 6px;padding-inline-start:20px}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-start-start-radius:6px}
.msg.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-start-end-radius:6px;box-shadow:var(--shadow)}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-block:8px}
.composer textarea{flex:1;min-width:0;min-height:48px;max-height:140px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);resize:none;font-size:15px}
.composer textarea:focus{border-color:var(--accent);outline:none}
.composer .btn{height:48px;border-radius:16px}
.proposal{display:flex;flex-direction:column;gap:8px;border-color:var(--plate)}
.proposal ul{margin:4px 0 0;padding-inline-start:18px;font-size:13.5px}
.dots::after{content:"…";animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.chips .chip{font-weight:500}
/* technique */
.techbtn{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.techbtn svg{width:15px;height:15px}
.tech{display:flex;flex-direction:column;gap:10px}
.tech-sec ol,.tech-sec ul{margin:4px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
.tech-sec.tips b{color:var(--good)}
.tech-sec.avoid b{color:var(--bad)}
.addphoto{height:120px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-weight:600}
.addphoto svg{width:26px;height:26px}

/* rest timer */
.rest{position:fixed;z-index:7;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  max-width:596px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.rest .t{font-family:var(--f-num);font-size:26px;font-weight:600;min-width:72px;direction:ltr}
.rest .lbl{flex:1;font-size:13px;line-height:1.3}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.rest.over{background:var(--good);color:var(--surface)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select.inp{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 12px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.chart .lbl-end{fill:var(--ink);font-weight:600;font-size:12px}
.hist{display:flex;flex-direction:column}
.hist-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline;flex-wrap:wrap}
.hist-row:first-child{border-top:0}
.sess{border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess > button{width:100%;background:none;border:0;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right}
.sess-body{padding-bottom:12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sess-body .ex-name{font-weight:500}

/* plan editor */
.day-ed{display:flex;flex-direction:column;gap:12px}
.day-ed > .spread input{font-family:var(--f-display);font-size:22px;font-weight:800;font-weight:700;border:0;background:transparent;border-bottom:2px solid var(--line);padding:2px 0;min-width:0;flex:1}
.ex-ed{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ex-ed + .ex-ed{border-top:1px dashed var(--line)}
.ex-ed .nm{width:100%;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:0 10px;direction:ltr;text-align:left}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600}
.nums input{height:38px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 6px;text-align:center;font-family:var(--f-num);font-size:15px;width:100%;min-width:0}
.savebar{position:fixed;z-index:7;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:596px;margin:0 auto;
  background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.savebar span{flex:1;font-size:14px;font-weight:600}
textarea.inp{width:100%;min-height:110px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:10px;font-family:var(--f-num);font-size:12px;direction:ltr}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet h2{font-family:var(--f-display);font-size:26px;font-weight:800}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
section > h3{font-size:15px;margin-bottom:10px}
.thumb{flex:none;width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface-2);position:relative;display:grid;place-items:center;padding:0;color:var(--muted)}
.thumb.has{border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}
.thumb .cam{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600}
.thumb .cam svg{width:20px;height:20px}
.thumb .mark{position:absolute;top:-7px;right:-7px;width:24px;height:24px;font-size:12px;border:2px solid var(--surface)}
.stock{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stock figure{margin:0;display:flex;flex-direction:column;gap:4px}
.stock figcaption{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.viewer-img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--surface-2);display:block}
@media (max-width:380px){ .tiles{grid-template-columns:1fr 1fr} .nums{grid-template-columns:1fr 1fr} .hero h2{font-size:28px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap" id="app">

function md(t) {
  const lines = esc(t).split(/\n/); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + m[1] + "</li>"; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^\s*#+\s*/.test(l)) out += "<p><b>" + l.replace(/^\s*#+\s*/, "") + "</b></p>";
    else if (l.trim()) out += "<p>" + l + "</p>";
  }
  if (inList) out += "</ul>";
  return out;
}

function normalizePlan(i) {
  const knownEx = new Map(allEx(S.plan).map(e => [e.id, e]));
  const knownDays = new Set(S.plan ? S.plan.days.map(d => d.id) : []);
  const days = (Array.isArray(i.days) ? i.days : []).map(d => ({
    id: d && knownDays.has(String(d.id)) ? String(d.id) : "d" + uid(),
    name: String((d && d.name) || "").trim(),

      id: "g" + uid(),

function seriesFor(exId, metric) {
  return history(exId).map(x => {
    const v = metric === "top" ? Math.max(...x.sets.map(s => s.w)) : metric === "vol" ? x.sets.reduce((a, s) => a + s.w * s.r, 0) : Math.max(...x.sets.map(s => e1rm(s.w, s.r)));
    return { date: x.date, v: r1(v), sets: x.sets };
  });
}
function niceTicks(min, max, n) {
  if (min === max) { min = min - 1; max = max + 1; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(r1(v));
  return t;
}
function chart(pts, unit) {
  const W = 360, H = 200, L = 40, R = 18, T = 20, B = 26;
  const vs = pts.map(p => p.v);
  const ticks = niceTicks(Math.min(...vs), Math.max(...vs), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => pts.length === 1 ? (L + (W - R)) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="رسم تطور التمرين">';
  ticks.forEach(t => { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + fmt(t) + "</text>"; });
  const line = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  if (pts.length > 1) {
    s += '<path d="' + line + " L" + X(pts.length - 1).toFixed(1) + " " + Y(y0) + " L" + X(0).toFixed(1) + " " + Y(y0) + ' Z" fill="var(--accent)" fill-opacity=".12"/>';
    s += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach((p, i) => { const end = i === pts.length - 1; s += '<circle cx="' + X(i) + '" cy="' + Y(p.v) + '" r="' + (end ? 5.5 : 3) + '" fill="' + (end ? "var(--accent)" : "var(--surface)") + '" stroke="var(--accent)" stroke-width="2"/>'; });
  const li = pts.length - 1, lx = X(li), anchor = pts.length === 1 ? "middle" : "end";
  s += '<text class="lbl-end" x="' + lx + '" y="' + (Y(pts[li].v) - 11) + '" text-anchor="' + anchor + '">' + fmt(pts[li].v) + " " + unit + "</text>";
  const dl = d => dateFmt(d, { day: "numeric", month: "short" });
  s += '<text x="' + X(0) + '" y="' + (H - 8) + '" text-anchor="' + (pts.length === 1 ? "middle" : "start") + '">' + esc(dl(pts[0].date)) + "</text>";
  if (pts.length > 1) s += '<text x="' + lx + '" y="' + (H - 8) + '" text-anchor="end">' + esc(dl(pts[li].date)) + "</text>";
  return s + "</svg>";
}

const saveActive = () => lsSet("gv.active", S.active);
function startWorkout(dayId) {
  const day = S.plan.days.find(d => d.id === dayId); if (!day) return;
  const log = {}, prev = {};
  day.groups.forEach(g => g.ex.forEach(ex => {
    const h = history(ex.id), last = h.length ? h[h.length - 1].sets : [], sg = suggest(ex);
    prev[ex.id] = last;
    // start from the last weight used; when the plan says go up or down, start from the new weight
    log[ex.id] = Array.from({ length: ex.sets }, (_, i) => {
      let w = "";
      if ((sg.kind === "up" || sg.kind === "down") && sg.w != null) w = fmt(sg.w);
      else if (last[i]) w = fmt(last[i].w);
      else if (last.length) w = fmt(last[last.length - 1].w);
      return { w, r: "", done: false };
    });
  }));
  S.active = { id: uid(), start: Date.now(), day: clone(day), log, prev };
  saveActive(); S.pickDay = null;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC && !audio) audio = new AC(); } catch (e) {}
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {}
  window.scrollTo(0, 0); render(); window.scrollTo(0, 0);
}
function findInActive(exId) {
  for (const g of S.active.day.groups) { const i = g.ex.findIndex(e => e.id === exId); if (i >= 0) return { g, ex: g.ex[i], isLast: i === g.ex.length - 1 }; }
  return null;
}
function tick(exId, i) {
  const row = S.active.log[exId][i];
  const f = findInActive(exId);
  if (row.done) { row.done = false; S.fresh = null; saveActive(); render(); return; }
  const sg = suggest(f.ex);
  const w = row.w !== "" ? parseFloat(String(row.w).replace(",", ".")) : sg.w;
  const r = row.r !== "" ? parseInt(row.r, 10) : sg.r;
  if (w == null || isNaN(w)) { toast("اكتب الوزن أول (اكتب 0 لو بوزن جسمك)"); const el = document.getElementById("w-" + exId + "-" + i); el && el.focus(); return; }
  if (!r || isNaN(r)) { toast("اكتب عدد العدات"); return; }

  const pv = (S.active.prev && S.active.prev[exId]) || [];
  const c = cmpSet(rowVal(row), pv[i]);
  S.fresh = exId + ":" + i;
  if (c && c.k === "up") { try { navigator.vibrate && navigator.vibrate(35); } catch (x) {} }
  if (S.active.log[exId].every(x => x.done) && exImproved(S.active, exId)) { S.fresh = exId + ":done"; toast("↑ تحسنت في " + f.ex.name); }
  // carry weight forward to the next empty set of the same exercise
  const nx = S.active.log[exId][i + 1];

  saveActive();

}
async function finish() {
  const A = S.active;
  const entries = [];
  A.day.groups.forEach(g => g.ex.forEach(ex => {
    const sets = (A.log[ex.id] || []).filter(s => s.done).map(s => ({ w: parseFloat(s.w) || 0, r: parseInt(s.r, 10) || 0 }));
    if (sets.length) entries.push({ exId: ex.id, name: ex.name, sets });
  }));
  if (!entries.length) { toast("ما سجلت ولا جولة. اضغط ✓ بعد كل جولة."); return; }
  const prs = [];
  entries.forEach(en => {
    const h = history(en.exId);
    if (!h.length) return;
    const prevBest = Math.max(...h.flatMap(x => x.sets.map(s => e1rm(s.w, s.r))));
    const prevTop = Math.max(...h.flatMap(x => x.sets.map(s => s.w)));
    const nowBest = Math.max(...en.sets.map(s => e1rm(s.w, s.r)));
    const nowTop = Math.max(...en.sets.map(s => s.w));
    if (nowTop > prevTop) prs.push({ name: en.name, text: "أثقل وزن " + fmt(nowTop) + " كغ" });
    else if (nowBest > prevBest + 0.05) prs.push({ name: en.name, text: "قوة تقديرية " + fmt(nowBest) + " كغ" });
  });
  const s = { id: A.id, date: new Date(A.start).toISOString(), dayId: A.day.id, dayName: A.day.name, durationSec: Math.round((Date.now() - A.start) / 1000), entries };
  try { await putSession(s); } catch (e) { writeErr(e); return; }
  const improved = entries.filter(en => exImproved(A, en.exId) && !prs.some(p => p.name === en.name)).map(en => en.name);
  S.summary = { improved, dayName: s.dayName, sets: entries.reduce((a, e) => a + e.sets.length, 0), vol: entries.reduce((a, e) => a + e.sets.reduce((b, x) => b + x.w * x.r, 0), 0), min: s.durationSec / 60, prs };

  render();
}
function validDraft(D) {

      if (!(e.sets >= 1)) return "عدد الجولات لازم يكون 1 أو أكثر (" + e.name + ").";

      if (prevArmed !== "import") { S.armed = "import"; render(); break; }
      let data; try { data = JSON.parse(S.exportText); } catch (x) { toast("النص مو نسخة احتياطية صحيحة."); render(); break; }
      if (!data || !data.plan || !Array.isArray(data.plan.days)) { toast("النص مو نسخة احتياطية صحيحة."); render(); break; }
      try {
        await putPlan(data.plan);
        for (const s of (data.sessions || [])) if (s && s.id && s.date) await putSession(s);
        if (data.photos && typeof data.photos === "object") for (const k in data.photos) if (typeof data.photos[k] === "string" && data.photos[k].indexOf("data:image/") === 0) photoSet(k, data.photos[k]);
        S.draft = null; S.dirty = false; S.exportText = ""; toast("تم الاسترجاع");
      } catch (x) { writeErr(x); }
      render(); break;
    }
  }
});

document.getElementById("photoIn").addEventListener("change", async e => {
  const inp = e.target, f = inp.files && inp.files[0]; inp.value = "";
  if (!f || !photoTarget) return;
  try { const data = await shrink(f); if (photoSet(photoTarget, data)) { S.photoView = null; toast("انحفظت صورة الجهاز"); render(); } }
  catch (x) { toast("ما قدرت أقرا الصورة. جرّب صورة ثانية."); }
});
boot();
})();
</script>
